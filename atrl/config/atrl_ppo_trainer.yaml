# ATRL PPO trainer. Uses stock verl and the recipe-local grpo_segment estimator.
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - ppo_trainer
  - _self_

algorithm:
  adv_estimator: grpo_segment

actor_rollout_ref:
  rollout:
    multi_turn:
      enable: true
      max_assistant_turns: 100
      max_user_turns: 100
      format: hermes
    agent:
      default_agent_loop: atrl
      agent_loop_config_path: recipe/atrl/config/agent_loop.yaml

trainer:
  use_v1: true
